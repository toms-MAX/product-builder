grammar_point: 현재완료
description: "Present Perfect — have/has + p.p."
level_min: 1
level_max: 8
templates:

  # ─ A유형: 조동사 빈칸 ──────────────────────────────────────
  # 문장 안에 주어·동사·목적어가 보이고, 빈칸은 has / have 선택
  # 학생이 테스트받는 것: "이 주어에는 has인가, have인가?"

  - id: 현재완료_A001
    stem: "The {SUBJECT_PERSON} _____ already {VERB_PP} the {OBJECT_THING}."
    q_type: FIB_MCQ
    answer: "has"
    wrong_choices: ["have", "had", "is", "was"]
    note: "3인칭 단수(The + 단수명사) → has"

  - id: 현재완료_A002
    stem: "I _____ never {VERB_PP} such a {OBJECT_THING} before."
    q_type: FIB_MCQ
    answer: "have"
    wrong_choices: ["has", "had", "am", "was"]
    note: "1인칭(I) → have"

  - id: 현재완료_A003
    stem: "The {SUBJECT_PERSON}s _____ just {VERB_PP} the {OBJECT_THING}."
    q_type: FIB_MCQ
    answer: "have"
    wrong_choices: ["has", "had", "are", "were"]
    note: "복수 주어(~s) → have"

  - id: 현재완료_A004
    stem: "She _____ {VERB_PP} the {OBJECT_THING} three times."
    q_type: FIB_MCQ
    answer: "has"
    wrong_choices: ["have", "had", "is", "does"]
    note: "She(3인칭 단수) → has"

  - id: 현재완료_A005
    stem: "We _____ not yet {VERB_PP} the {OBJECT_THING}."
    q_type: FIB_MCQ
    answer: "have"
    wrong_choices: ["has", "had", "are", "do"]
    note: "We(복수) → have"

  - id: 현재완료_A006
    stem: "How long _____ the {SUBJECT_PERSON} {VERB_PP} the {OBJECT_THING}?"
    q_type: FIB_MCQ
    answer: "has"
    wrong_choices: ["have", "had", "does", "is"]
    note: "의문문 — 단수 주어 → has (계속 용법)"

  - id: 현재완료_A007
    stem: "He _____ already {VERB_PP} the {OBJECT_THING} twice."
    q_type: FIB_MCQ
    answer: "has"
    wrong_choices: ["have", "had", "is", "does"]
    note: "He(3인칭 단수) → has"

  - id: 현재완료_A008
    stem: "They _____ recently {VERB_PP} a new {OBJECT_THING}."
    q_type: FIB_MCQ
    answer: "have"
    wrong_choices: ["has", "had", "are", "will"]
    note: "They(복수) → have"
