grammar_point: 현재완료
description: "Present Perfect — have/has + p.p."
level_min: 1
level_max: 8
templates:
  - id: 현재완료_001
    stem: "The {SUBJECT_PERSON} has already {VERB_PP} the {OBJECT_THING}."
    q_type: FIB_MCQ
    answer_slot: VERB_PP
    note: "already — 완료 용법"

  - id: 현재완료_002
    stem: "The {SUBJECT_PERSON} has just {VERB_PP} the {OBJECT_THING}."
    q_type: FIB_MCQ
    answer_slot: VERB_PP
    note: "just — 방금 완료"

  - id: 현재완료_003
    stem: "The {SUBJECT_PERSON} has never {VERB_PP} the {OBJECT_THING} before."
    q_type: FIB_MCQ
    answer_slot: VERB_PP
    note: "never — 경험 부정"

  - id: 현재완료_004
    stem: "Have you ever {VERB_PP} this kind of {OBJECT_THING}?"
    q_type: FIB_MCQ
    answer_slot: VERB_PP
    note: "ever — 경험 의문문"

  - id: 현재완료_005
    stem: "The {SUBJECT_PERSON} has recently {VERB_PP} the {OBJECT_THING}."
    q_type: FIB_MCQ
    answer_slot: VERB_PP
    note: "recently — 최근 완료"

  - id: 현재완료_006
    stem: "How long has the {SUBJECT_PERSON} {VERB_PP} the {OBJECT_THING}?"
    q_type: FIB_MCQ
    answer_slot: VERB_PP
    level_min: 2
    note: "계속 용법 의문문"

  - id: 현재완료_007
    stem: "The {SUBJECT_PERSON} has {VERB_PP} the {OBJECT_THING} three times."
    q_type: FIB_MCQ
    answer_slot: VERB_PP
    note: "횟수 — 경험 용법"

  - id: 현재완료_008
    stem: "The {SUBJECT_PERSON} has not yet {VERB_PP} the {OBJECT_THING}."
    q_type: FIB_MCQ
    answer_slot: VERB_PP
    note: "not yet — 미완료"
