    answer_slot: ADJ_POSITIVE
    note: "as ~ as any 최상급 의미"

  - id: 원급비교_003
    stem: "The {SUBJECT_PERSON} worked as {ADV_MANNER} as possible to finish the {OBJECT_THING}."
    q_type: FIB_MCQ
    answer_slot: ADV_MANNER
    note: "as ~ as possible"

  - id: 원급비교_004
    stem: "This {OBJECT_THING} is twice as {ADJ_POSITIVE} as that one."
    q_type: FIB_MCQ
    answer_slot: ADJ_POSITIVE
    level_min: 4
    note: "배수 원급 비교"
