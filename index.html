<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>중학교 영어 시험 도우미 - Pro</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
</head>
<body>
    <div id="version-display" style="position: fixed; top: 10px; left: 10px; background: rgba(0,0,0,0.8); color: #0f0; padding: 3px 8px; border-radius: 4px; font-size: 11px; z-index: 9999; pointer-events: none; font-family: monospace;">
        v0.5.0 
    </div>

    <div class="container main-container">
        <button id="theme-toggle">다크 모드</button>
        <h1>영어 내신 문제 생성 공장 <span style="font-size: 0.5em; vertical-align: middle; color: #f1c40f;">ANT COLONY</span></h1>

        <div class="main-layout">
            <!-- 왼쪽: 내용 입력 및 유형 선택 -->
            <div class="input-section">
                <h3>🐜 1. 시험 지문 투입</h3>
                <textarea id="reading-material" placeholder="개미들에게 줄 지문을 입력하세요..." style="height: 250px;"></textarea>
                
                <h3 style="margin-top: 20px;">🧬 2. 생성할 문제 유형 선택</h3>
                
                <!-- ** NEW: 주관식/객관식 필터 ** -->
                <div id="dna-type-filter" style="margin-bottom: 10px;">
                    <input type="radio" id="filter-all" name="dna-filter" value="all" checked>
                    <label for="filter-all">모두</label>
                    <input type="radio" id="filter-objective" name="dna-filter" value="객관식">
                    <label for="filter-objective">객관식</label>
                    <input type="radio" id="filter-subjective" name="dna-filter" value="주관식">
                    <label for="filter-subjective">주관식</label>
                </div>

                <div id="dna-selection-container" class="dna-selection-container" style="height: 150px; overflow-y: auto; background: #f9f9f9; border: 1px solid #ddd; padding: 15px; border-radius: 8px;">
                    <!-- DNA 체크박스가 여기에 동적으로 추가됩니다. -->
                    <p style="color: #888;">문제 유형(DNA) 로딩 중...</p>
                </div>
            </div>

            <!-- (오른쪽 섹션은 변경 없음) -->
            <div class="style-section">
                 <!-- ... -->
            </div>
        </div>

        <!-- (결과 및 API 설정 영역은 변경 없음) -->
         <!-- ... -->

    </div>
    <script src="colony_engine.js"></script>
</body>
</html>
