<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>중학교 영어 시험 도우미 - Pro</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
</head>
<body>
    <div id="version-display" style="position: fixed; top: 10px; left: 10px; background: rgba(0,0,0,0.8); color: #0f0; padding: 3px 8px; border-radius: 4px; font-size: 11px; z-index: 9999; pointer-events: none; font-family: monospace;">
        v0.2.0
    </div>

    <div class="container main-container">
        <button id="theme-toggle">다크 모드</button>
        <h1>영어 내신 문제 생성 공장 <span style="font-size: 0.5em; vertical-align: middle; color: #f1c40f;">ANT COLONY</span></h1>

        <div class="main-layout">
            <!-- 왼쪽: 내용 입력창 -->
            <div class="input-section">
                <h3>🐜 1. 시험 지문 투입</h3>
                <textarea id="reading-material" placeholder="개미들에게 줄 지문을 입력하세요..." style="height: 400px;"></textarea>
            </div>

            <!-- 오른쪽: 설정 및 로그 -->
            <div class="style-section">
                <h3>🛠️ 2. 군집 제어 설정</h3>
                
                <div class="config-mini" style="margin-bottom: 20px; display: flex; flex-wrap: wrap; gap: 15px; align-items: center; background: #f8f9fa; padding: 15px; border-radius: 8px;">
                    <div>
                        <label style="font-weight: bold; display: block; margin-bottom: 5px;">목표 난이도</label>
                        <select id="predict-level" style="padding: 8px; border-radius: 4px;">
                            <option value="easy">쉬움 (중등 기초)</option>
                            <option value="medium" selected>보통 (중등 심화)</option>
                            <option value="hard">어려움 (고등 수준)</option>
                        </select>
                    </div>
                    <div>
                        <label style="font-weight: bold; display: block; margin-bottom: 5px;">생산 문항 수</label>
                        <input type="number" id="predict-count" min="1" max="10" value="3" style="width: 60px; padding: 7px; border: 1px solid #ccc; border-radius: 4px;">
                    </div>
                </div>
                
                <button id="generate-btn" class="action-btn" style="width: 100%; height: 60px; font-size: 1.2em; font-weight: bold; background: #2c3e50; color: white;">⚙️ 개미 군집 가동 (Start Colony)</button>
                
                <!-- 개미 작업 로그판 -->
                <div style="margin-top: 25px;">
                    <label style="font-size: 0.9em; font-weight: bold; color: #2c3e50;">🐜 개미 실시간 작업 현황 (Colony Logs)</label>
                    <div id="factory-status" class="factory-status" style="display: block; margin-top: 5px; text-align: left; padding: 15px; background: #1a1a1a; color: #0f0; font-family: 'Courier New', monospace; font-size: 0.85em; border-radius: 4px; height: 300px; overflow-y: auto; border: 2px solid #333;">
                        <div id="compute-log"></div>
                    </div>
                </div>
            </div>
        </div>

        <!-- 결과 영역 -->
        <div id="result-container" class="result-area" style="margin-top: 30px;">
            <div style="display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid #eee; padding-bottom: 10px; margin-bottom: 15px;">
                <h3>생성된 예상 문제</h3>
                <button id="export-pdf" class="secondary-btn" style="padding: 5px 15px;">PDF 저장</button>
            </div>
            <div id="generated-questions">
                <p class="empty-msg">지문과 형식을 입력한 후 버튼을 눌러주세요.</p>
            </div>
        </div>

        <!-- API 키 설정 (하단으로 이동) -->
        <details style="margin-top: 50px; opacity: 0.6;">
            <summary style="cursor: pointer; font-size: 0.9em;">API 설정 및 도움말</summary>
            <div id="api-config" style="padding: 15px; background: #f9f9f9; border-radius: 8px; border: 1px solid #ddd; margin-top: 10px; text-align: left;">
                <label style="font-size: 0.85em; font-weight: bold;">Groq API 키:</label>
                <div style="display: flex; gap: 10px; margin-top: 5px;">
                    <input type="password" id="api-key-input" placeholder="gsk_..." style="flex: 1; padding: 8px;">
                    <button id="save-key-btn" style="padding: 8px 15px;">저장</button>
                </div>
            </div>
        </details>
    </div>

        <div style="margin-top: 30px;">
            <a href="contact.html" class="nav-link">제휴 문의하기</a>
        </div>
    </div>
    <script src="colony_engine.js"></script>
</body>
</html>
