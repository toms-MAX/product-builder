<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Exam Splitter</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Segoe UI', system-ui, sans-serif;
    background: #f4f6f9;
    color: #1e2330;
    min-height: 100vh;
  }

  /* ── 헤더 ── */
  header {
    background: #2563eb;
    color: #fff;
    padding: 18px 32px;
    display: flex;
    align-items: center;
    gap: 12px;
    box-shadow: 0 2px 8px rgba(0,0,0,.15);
  }
  header h1 { font-size: 1.25rem; font-weight: 700; }
  header span { font-size: .875rem; opacity: .8; }

  /* ── 업로드 존 ── */
  #upload-section {
    max-width: 680px;
    margin: 40px auto 0;
    padding: 0 16px;
  }

  .drop-zone {
    border: 2.5px dashed #93c5fd;
    border-radius: 14px;
    background: #fff;
    padding: 48px 24px;
    text-align: center;
    cursor: pointer;
    transition: border-color .2s, background .2s;
  }
  .drop-zone:hover, .drop-zone.over {
    border-color: #2563eb;
    background: #eff6ff;
  }
  .drop-zone .icon { font-size: 2.5rem; margin-bottom: 10px; }
  .drop-zone p   { color: #64748b; font-size: .95rem; }
  .drop-zone input { display: none; }

  #file-name {
    margin-top: 10px;
    font-size: .85rem;
    color: #2563eb;
    min-height: 1.2em;
    text-align: center;
  }

  .btn-primary {
    display: block;
    width: 100%;
    margin-top: 16px;
    padding: 13px;
    background: #2563eb;
    color: #fff;
    font-size: 1rem;
    font-weight: 600;
    border: none;
    border-radius: 10px;
    cursor: pointer;
    transition: background .2s;
  }
  .btn-primary:hover { background: #1d4ed8; }
  .btn-primary:disabled { background: #93c5fd; cursor: not-allowed; }

  /* ── 진행 상태 ── */
  #status {
    max-width: 680px;
    margin: 16px auto 0;
    padding: 0 16px;
    font-size: .9rem;
    color: #64748b;
    min-height: 1.4em;
    text-align: center;
  }

  /* ── 결과 영역 ── */
  #results-section { display: none; max-width: 1100px; margin: 32px auto 80px; padding: 0 16px; }

  .results-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 20px;
    flex-wrap: wrap;
    gap: 10px;
  }
  .results-header h2 { font-size: 1.1rem; font-weight: 700; }

  .btn-save {
    padding: 10px 28px;
    background: #16a34a;
    color: #fff;
    font-size: .95rem;
    font-weight: 600;
    border: none;
    border-radius: 8px;
    cursor: pointer;
    transition: background .2s;
  }
  .btn-save:hover { background: #15803d; }

  /* ── 문제 카드 ── */
  #questions-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
    gap: 20px;
  }

  .q-card {
    background: #fff;
    border-radius: 12px;
    box-shadow: 0 1px 4px rgba(0,0,0,.08);
    overflow: hidden;
    display: flex;
    flex-direction: column;
  }

  .q-card-header {
    background: #1e40af;
    color: #fff;
    padding: 8px 14px;
    font-size: .8rem;
    font-weight: 700;
    letter-spacing: .05em;
  }

  .q-card-img {
    border-bottom: 1px solid #e2e8f0;
    text-align: center;
    background: #fafafa;
    padding: 6px;
  }
  .q-card-img img {
    max-width: 100%;
    max-height: 260px;
    object-fit: contain;
    display: block;
    margin: 0 auto;
  }

  .q-card-text {
    padding: 10px 14px;
    font-size: .78rem;
    color: #475569;
    background: #f8fafc;
    border-bottom: 1px solid #e2e8f0;
    white-space: pre-wrap;
    max-height: 110px;
    overflow-y: auto;
    line-height: 1.5;
  }

  .q-card-tags {
    padding: 12px 14px;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }

  /* 난이도 별점 */
  .tag-row { display: flex; align-items: center; gap: 8px; }
  .tag-label {
    font-size: .78rem;
    font-weight: 600;
    color: #64748b;
    min-width: 42px;
  }

  .stars { display: flex; gap: 3px; }
  .star {
    font-size: 1.2rem;
    cursor: pointer;
    color: #cbd5e1;
    transition: color .1s;
    user-select: none;
    line-height: 1;
  }
  .star.on { color: #f59e0b; }

  /* 주제 입력 */
  .topic-wrap { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }

  .topic-select {
    flex: 1;
    min-width: 110px;
    padding: 5px 8px;
    border: 1.5px solid #cbd5e1;
    border-radius: 6px;
    font-size: .8rem;
    color: #1e2330;
    background: #fff;
    cursor: pointer;
  }
  .topic-select:focus { outline: none; border-color: #2563eb; }

  .topic-custom {
    flex: 1;
    min-width: 80px;
    padding: 5px 8px;
    border: 1.5px solid #cbd5e1;
    border-radius: 6px;
    font-size: .8rem;
    color: #1e2330;
  }
  .topic-custom:focus { outline: none; border-color: #2563eb; }
  .topic-custom::placeholder { color: #94a3b8; }

  /* 저장 성공 토스트 */
  #toast {
    position: fixed;
    bottom: 28px;
    left: 50%;
    transform: translateX(-50%) translateY(60px);
    background: #16a34a;
    color: #fff;
    padding: 12px 28px;
    border-radius: 8px;
    font-size: .9rem;
    font-weight: 600;
    box-shadow: 0 4px 16px rgba(0,0,0,.18);
    opacity: 0;
    transition: opacity .3s, transform .3s;
    pointer-events: none;
    z-index: 999;
  }
  #toast.show {
    opacity: 1;
    transform: translateX(-50%) translateY(0);
  }
</style>
</head>
<body>

<header>
  <div>
    <h1>Exam Splitter</h1>
    <span>시험지 이미지 → 낱개 문제 분리 + 태깅</span>
  </div>
</header>

<!-- ── 업로드 ── -->
<section id="upload-section">
  <div class="drop-zone" id="drop-zone">
    <div class="icon">📄</div>
    <p>시험지 이미지를 여기에 드래그하거나 클릭하여 선택하세요</p>
    <p style="font-size:.8rem;margin-top:6px;color:#94a3b8">PNG · JPG · JPEG · WEBP</p>
    <input type="file" id="file-input" accept="image/*">
  </div>
  <div id="file-name"></div>
  <button class="btn-primary" id="process-btn" disabled>문제 분리 시작</button>
</section>

<div id="status"></div>

<!-- ── 결과 ── -->
<section id="results-section">
  <div class="results-header">
    <h2 id="result-title"></h2>
    <button class="btn-save" id="save-btn">💾 JSON으로 저장</button>
  </div>
  <div id="questions-grid"></div>
</section>

<div id="toast">저장 완료!</div>

<script>
// ── 상수 ──
const PRESET_TOPICS = [
  "관계대명사", "관계부사", "시제", "가정법", "수동태",
  "부정사", "동명사", "분사", "접속사", "전치사",
  "비교급·최상급", "도치·강조", "어법", "어휘",
  "빈칸추론", "주제·제목·요지", "순서배열",
  "문장삽입", "요약", "독해종합", "기타"
];

// ── 상태 ──
let sessionId = null;
let questions = [];  // 현재 태깅 상태

// ── 드래그 앤 드롭 & 파일 선택 ──
const dropZone  = document.getElementById("drop-zone");
const fileInput = document.getElementById("file-input");
const fileName  = document.getElementById("file-name");
const processBtn= document.getElementById("process-btn");

dropZone.addEventListener("click", () => fileInput.click());

dropZone.addEventListener("dragover", e => { e.preventDefault(); dropZone.classList.add("over"); });
dropZone.addEventListener("dragleave", ()=> dropZone.classList.remove("over"));
dropZone.addEventListener("drop", e => {
  e.preventDefault();
  dropZone.classList.remove("over");
  const file = e.dataTransfer.files[0];
  if (file) setFile(file);
});

fileInput.addEventListener("change", () => {
  if (fileInput.files[0]) setFile(fileInput.files[0]);
});

function setFile(file) {
  fileName.textContent = file.name;
  processBtn.disabled = false;
  processBtn._file = file;
}

// ── 처리 요청 ──
processBtn.addEventListener("click", async () => {
  const file = processBtn._file;
  if (!file) return;

  setStatus("이미지 분석 중... ⏳");
  processBtn.disabled = true;

  const form = new FormData();
  form.append("file", file);

  try {
    const res  = await fetch("/process", { method: "POST", body: form });
    const data = await res.json();

    if (data.error) { setStatus("오류: " + data.error); processBtn.disabled = false; return; }

    sessionId = data.session_id;
    questions = data.questions;
    setStatus("");
    renderResults();
  } catch (e) {
    setStatus("서버 오류: " + e.message);
    processBtn.disabled = false;
  }
});

function setStatus(msg) {
  document.getElementById("status").textContent = msg;
}

// ── 결과 렌더링 ──
function renderResults() {
  const section = document.getElementById("results-section");
  const grid    = document.getElementById("questions-grid");
  const title   = document.getElementById("result-title");

  title.textContent = `총 ${questions.length}개 문제 감지됨`;
  grid.innerHTML = "";
  section.style.display = "block";

  questions.forEach((q, idx) => {
    const card = buildCard(q, idx);
    grid.appendChild(card);
  });

  section.scrollIntoView({ behavior: "smooth" });
}

function buildCard(q, idx) {
  const card = document.createElement("div");
  card.className = "q-card";

  // ── 헤더
  const hdr = document.createElement("div");
  hdr.className = "q-card-header";
  hdr.textContent = `문제 ${q.id}`;
  card.appendChild(hdr);

  // ── 이미지
  const imgWrap = document.createElement("div");
  imgWrap.className = "q-card-img";
  const img = document.createElement("img");
  img.src = `/img/${sessionId}/${q.image_file}`;
  img.alt = `문제 ${q.id}`;
  imgWrap.appendChild(img);
  card.appendChild(imgWrap);

  // ── 텍스트
  const txt = document.createElement("div");
  txt.className = "q-card-text";
  txt.textContent = q.text || "(텍스트 없음)";
  card.appendChild(txt);

  // ── 태그 영역
  const tags = document.createElement("div");
  tags.className = "q-card-tags";

  // 난이도
  const diffRow = document.createElement("div");
  diffRow.className = "tag-row";
  const diffLabel = document.createElement("span");
  diffLabel.className = "tag-label";
  diffLabel.textContent = "난이도";
  const stars = buildStars(idx, q.difficulty);
  diffRow.appendChild(diffLabel);
  diffRow.appendChild(stars);
  tags.appendChild(diffRow);

  // 주제
  const topicRow = document.createElement("div");
  topicRow.className = "tag-row";
  const topicLabel = document.createElement("span");
  topicLabel.className = "tag-label";
  topicLabel.textContent = "주제";
  const topicWrap = buildTopicInput(idx, q.topic);
  topicRow.appendChild(topicLabel);
  topicRow.appendChild(topicWrap);
  tags.appendChild(topicRow);

  card.appendChild(tags);
  return card;
}

// ── 별점 위젯 ──
function buildStars(idx, current) {
  const wrap = document.createElement("div");
  wrap.className = "stars";
  for (let i = 1; i <= 5; i++) {
    const star = document.createElement("span");
    star.className = "star" + (current >= i ? " on" : "");
    star.textContent = "★";
    star.dataset.val = i;
    star.addEventListener("click", () => {
      const val = parseInt(star.dataset.val);
      questions[idx].difficulty = val;
      // 갱신
      wrap.querySelectorAll(".star").forEach(s => {
        s.classList.toggle("on", parseInt(s.dataset.val) <= val);
      });
    });
    wrap.appendChild(star);
  }
  return wrap;
}

// ── 주제 입력 (드롭다운 + 직접입력) ──
function buildTopicInput(idx, current) {
  const wrap = document.createElement("div");
  wrap.className = "topic-wrap";

  // 드롭다운
  const sel = document.createElement("select");
  sel.className = "topic-select";
  const defaultOpt = document.createElement("option");
  defaultOpt.value = "";
  defaultOpt.textContent = "-- 선택 --";
  sel.appendChild(defaultOpt);

  PRESET_TOPICS.forEach(t => {
    const opt = document.createElement("option");
    opt.value = t;
    opt.textContent = t;
    if (t === current) opt.selected = true;
    sel.appendChild(opt);
  });

  // 직접 입력
  const custom = document.createElement("input");
  custom.type = "text";
  custom.className = "topic-custom";
  custom.placeholder = "직접 입력";
  if (current && !PRESET_TOPICS.includes(current)) custom.value = current;

  sel.addEventListener("change", () => {
    if (sel.value) {
      questions[idx].topic = sel.value;
      custom.value = "";
    }
  });
  custom.addEventListener("input", () => {
    questions[idx].topic = custom.value;
    sel.value = "";
  });

  wrap.appendChild(sel);
  wrap.appendChild(custom);
  return wrap;
}

// ── 저장 ──
document.getElementById("save-btn").addEventListener("click", async () => {
  if (!sessionId) return;

  try {
    const res = await fetch("/save", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ session_id: sessionId, questions }),
    });
    const data = await res.json();
    if (data.success) showToast(`저장 완료! → ${data.saved_to}`);
    else showToast("저장 실패");
  } catch (e) {
    showToast("오류: " + e.message);
  }
});

function showToast(msg) {
  const t = document.getElementById("toast");
  t.textContent = msg;
  t.classList.add("show");
  setTimeout(() => t.classList.remove("show"), 3000);
}
</script>
</body>
</html>
